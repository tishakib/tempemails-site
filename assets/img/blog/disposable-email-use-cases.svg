<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4413D" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Blobs -->
  <circle cx="150" cy="150" r="240" fill="#F4413D" opacity="0.12" filter="url(#glowRed)" />
  <circle cx="1050" cy="480" r="240" fill="#3B82F6" opacity="0.08" filter="url(#glowBlue)" />

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-width="1" opacity="0.2">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Header / Brand Watermark -->
  <g transform="translate(80, 70)">
    <rect width="42" height="42" rx="10" fill="url(#brandGrad)" />
    <text x="21" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">T</text>
    <text x="56" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">tempemails<tspan fill="#F4413D">.site</tspan></text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(80, 140)">
    <rect width="170" height="34" rx="17" fill="#F4413D" fill-opacity="0.15" stroke="#F4413D" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="85" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#F87171" text-anchor="middle" letter-spacing="1">PRIVACY STRATEGY</text>
  </g>

  <!-- Main Title & Subtitle Container -->
  <g transform="translate(80, 220)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="#F8FAFC" letter-spacing="-0.5">
      <tspan x="0" dy="0">Disposable Email Use Cases</tspan>
    </text>
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="19" fill="#94A3B8">
      Practical privacy workflows for downloads, Wi-Fi and online services
    </text>
  </g>

  <!-- Right Visual / Diagram Area -->
  <g transform="translate(680, 110)" filter="url(#shadow)">
    <rect width="440" height="420" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
      <!-- 4 Use Case Badges Grid -->
      <g transform="translate(45, 60)">
        <rect x="0" y="0" width="160" height="130" rx="14" fill="#0F172A" stroke="#334155" />
        <text x="80" y="45" font-size="32" text-anchor="middle">&#x1F4F6;</text>
        <text x="80" y="80" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">Public Wi-Fi</text>
        <text x="80" y="105" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Skip promo spam</text>

        <rect x="180" y="0" width="160" height="130" rx="14" fill="#0F172A" stroke="#334155" />
        <text x="260" y="45" font-size="32" text-anchor="middle">&#x1F4C4;</text>
        <text x="260" y="80" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">Gated E-books</text>
        <text x="260" y="105" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">One-off PDF trials</text>

        <rect x="0" y="150" width="160" height="130" rx="14" fill="#0F172A" stroke="#334155" />
        <text x="80" y="195" font-size="32" text-anchor="middle">&#x1F4AC;</text>
        <text x="80" y="230" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">Web Forums</text>
        <text x="80" y="255" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Protect identity</text>

        <rect x="180" y="150" width="160" height="130" rx="14" fill="#0F172A" stroke="#334155" />
        <text x="260" y="195" font-size="32" text-anchor="middle">&#x1F9EA;</text>
        <text x="260" y="230" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">SaaS Trials</text>
        <text x="260" y="255" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Test before buying</text>
      </g>
    
  </g>

  <!-- Bottom Metadata Bar -->
  <g transform="translate(80, 545)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748B" font-weight="500">
      &#x1F6E1; Ephemeral Inbound Mail Architecture &#8226; Official tempemails.site Guide
    </text>
  </g>
</svg>