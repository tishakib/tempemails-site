<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4413D" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Blobs -->
  <circle cx="150" cy="150" r="280" fill="#F4413D" opacity="0.12" filter="blur(80px)" />
  <circle cx="1050" cy="480" r="280" fill="#3B82F6" opacity="0.08" filter="blur(90px)" />

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-width="1" opacity="0.2">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Header / Brand Watermark -->
  <g transform="translate(80, 70)">
    <rect width="42" height="42" rx="10" fill="url(#brandGrad)" />
    <text x="21" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">T</text>
    <text x="56" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">tempemails<tspan fill="#F4413D">.site</tspan></text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(80, 140)">
    <rect width="160" height="34" rx="17" fill="#F4413D" fill-opacity="0.15" stroke="#F4413D" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="80" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#F87171" text-anchor="middle" letter-spacing="1">TROUBLESHOOTING</text>
  </g>

  <!-- Main Title & Subtitle Container -->
  <g transform="translate(80, 220)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="#F8FAFC" letter-spacing="-0.5">
      <tspan x="0" dy="0">Not Receiving Emails? Diagnostics</tspan>
    </text>
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="19" fill="#94A3B8" width="550">
      Diagnostic checklist for delayed verification emails &amp; spam blocks
    </text>
  </g>

  <!-- Right Visual / Diagram Area -->
  <g transform="translate(680, 110)" filter="url(#shadow)">
    <rect width="440" height="420" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
      <!-- Diagnostic Checklist -->
      <g transform="translate(50, 50)">
        <rect width="340" height="65" rx="10" fill="#0F172A" stroke="#334155" />
        <circle cx="35" cy="32" r="14" fill="#F4413D" />
        <text x="35" y="37" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">1</text>
        <text x="65" y="28" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fff">Sender Mail Queue Delay</text>
        <text x="65" y="48" font-family="sans-serif" font-size="11" fill="#94A3B8">Senders often throttle outbound queues</text>

        <rect y="85" width="340" height="65" rx="10" fill="#0F172A" stroke="#334155" />
        <circle cx="35" cy="117" r="14" fill="#F59E0B" />
        <text x="35" y="122" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">2</text>
        <text x="65" y="113" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fff">Greylisting &amp; SPF Checks</text>
        <text x="65" y="133" font-family="sans-serif" font-size="11" fill="#94A3B8">Mail servers retry within 2-5 minutes</text>

        <rect y="170" width="340" height="65" rx="10" fill="#0F172A" stroke="#334155" />
        <circle cx="35" cy="202" r="14" fill="#10B981" />
        <text x="35" y="207" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle">3</text>
        <text x="65" y="198" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fff">Domain Blocklist Detection</text>
        <text x="65" y="218" font-family="sans-serif" font-size="11" fill="#94A3B8">Check if service rejects burner domains</text>

        <rect y="255" width="340" height="50" rx="10" fill="#1E293B" />
        <text x="170" y="285" font-family="sans-serif" font-weight="bold" font-size="12" fill="#60A5FA" text-anchor="middle">Action: Click "Change" for fresh address</text>
      </g>
    
  </g>

  <!-- Bottom Metadata Bar -->
  <g transform="translate(80, 545)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748B" font-weight="500">
      🛡️ Ephemeral Inbound Mail Architecture &bull; Official tempemails.site Guide
    </text>
  </g>
</svg>