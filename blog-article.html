  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Redirect | tempemails.site Blog</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://www.tempemails.site/blog">
  <script>
    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var slug = urlParams.get('slug');
      if (slug) {
        window.location.replace('/blog/' + encodeURIComponent(slug));
      } else {
        window.location.replace('/blog');
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script>
    (function(){try{const t=localStorage.getItem('tre_theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');}}catch(e){}})();
  </script>

  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-6 text-center font-sans">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MKQNSFD"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div class="max-w-md bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-4">
    <div class="w-12 h-12 bg-red-50 text-[#F4413D] rounded-xl mx-auto flex items-center justify-center font-bold text-xl">
      📖
    </div>
    <h1 class="text-xl font-extrabold text-slate-900">Redirecting to Article...</h1>
    <p class="text-sm text-slate-600 leading-relaxed">
      Our articles have moved to our clean URL structure. If you are not redirected automatically, please click below:
    </p>
    <div>
      <a id="redirect-link" href="/blog" class="inline-block px-5 py-2.5 bg-[#F4413D] hover:bg-red-600 text-white font-bold text-xs rounded-xl shadow-md transition-all">
        Browse Blog Articles &rarr;
      </a>
    </div>
  </div>
  <script>
    var urlParams = new URLSearchParams(window.location.search);
    var slug = urlParams.get('slug');
    if (slug) {
      var link = document.getElementById('redirect-link');
      link.href = '/blog/' + encodeURIComponent(slug);
      link.textContent = 'View Article (/blog/' + slug + ') →';
    }
  </script>
